<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Inline Formatting</title>
</head>
<body>
    <!-- Combined inline formatting -->
    <p>
        <strong>Dream big</strong>, work with <em>patience</em>, and keep your goals <mark>clear</mark>.<br>
        Every small step can lead to a <strong>better future</strong>.<br>
        <small>Keep learning and keep moving forward.</small>
    </p>
</body>
</html>
