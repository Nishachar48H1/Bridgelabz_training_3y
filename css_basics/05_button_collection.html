<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Collection</title>
    <link rel="stylesheet" href="05_button_collection.css">
</head>
<body>
    <main class="page">
        <h1>Styled Button Collection</h1>
        <p>Try hovering, focusing, pressing, and using the disabled button.</p>

        <section class="buttons">
            <button class="btn primary">Primary</button>
            <button class="btn secondary">Secondary</button>
            <button class="btn outline">Outline</button>
            <button class="btn disabled" disabled>Disabled</button>
        </section>
    </main>
</body>
</html>
