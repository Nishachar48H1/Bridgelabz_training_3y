<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="03_image_showcase.css">
</head>
<body>
    <header>
        <h1>Image Showcase</h1>
        <p>A responsive gallery with simple hover effects.</p>
    </header>

    <main>
        <section class="gallery">
            <figure>
                <div class="image-wrap">
                    <img src="https://picsum.photos/500/350?random=11" alt="Mountain landscape">
                    <span class="overlay"></span>
                </div>
                <figcaption>Mountain View</figcaption>
            </figure>

            <figure>
                <div class="image-wrap">
                    <img src="https://picsum.photos/500/350?random=12" alt="Forest landscape">
                    <span class="overlay"></span>
                </div>
                <figcaption>Quiet Forest</figcaption>
            </figure>

            <figure>
                <div class="image-wrap">
                    <img src="https://picsum.photos/500/350?random=13" alt="Lake landscape">
                    <span class="overlay"></span>
                </div>
                <figcaption>Blue Lake</figcaption>
            </figure>

            <figure>
                <div class="image-wrap">
                    <img src="https://picsum.photos/500/350?random=14" alt="Beach landscape">
                    <span class="overlay"></span>
                </div>
                <figcaption>Sunny Beach</figcaption>
            </figure>

            <figure>
                <div class="image-wrap">
                    <img src="https://picsum.photos/500/350?random=15" alt="City view">
                    <span class="overlay"></span>
                </div>
                <figcaption>City Lights</figcaption>
            </figure>

            <figure>
                <div class="image-wrap">
                    <img src="https://picsum.photos/500/350?random=16" alt="Desert landscape">
                    <span class="overlay"></span>
                </div>
                <figcaption>Golden Desert</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
