<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltips</title>
    <link rel="stylesheet" href="02_tooltips.css">
</head>
<body>
    <main class="page">
        <h1>CSS Tooltip Demo</h1>
        <p>Move your pointer over each item.</p>

        <section class="tooltip-row">
            <div class="tooltip-box">
                <span>Home</span>
                <span class="tooltip">Go to the home page</span>
            </div>

            <div class="tooltip-box">
                <span>Search</span>
                <span class="tooltip">Find something quickly</span>
            </div>

            <div class="tooltip-box">
                <span>Profile</span>
                <span class="tooltip">View your profile</span>
            </div>

            <div class="tooltip-box">
                <span>Settings</span>
                <span class="tooltip">Change your preferences</span>
            </div>
        </section>
    </main>
</body>
</html>
